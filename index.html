<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
            // Objects
            var a = {
                name: "Oy",
                lname: "Putra",
                age: "25",
                email: "oyputra@gmail.com",
                hobby: ["Billiard", "Football", "Futsal", "Badminton"],
                income: function() {
                    return 5000000;
                },
                fullName: function() {
                    return this.name + " " + this.lname;
                }
            };
            document.write(a.fullName() + "<br>");

            var data = new Object();
            data.firstName  = "Oy";
            data.lastName   = "Putra";
            data.age        = 25;
            document.write(data.firstName + "<br>"); 
    </script>
</body>
</html>
