<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        // isArray Methods
        var a = 20;
        var b = [20, 30, 40];

        document.write('var a: ' + a + '<br>')
        document.write('var b: ' + b + '<br>')
        
        if (Array.isArray(a)) {
            document.write('var a is an Array')
        } else {
            document.write('var a is not an Array')
        }
        
        document.write('<br>')
        
        if (Array.isArray(b)) {
            document.write('var b is an Array')
        } else {
            document.write('var b is not an Array')
        }
    </script>
</body>
</html>
