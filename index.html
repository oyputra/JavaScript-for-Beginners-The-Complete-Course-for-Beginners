<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        // Slice and Splice Methods
        var a = ['Dominic', 'Carl', 'Barry', 'Elle', 'Ferrary'];
        document.write('array: ' + a + '<br>');
               
        // The slice() method of Array instances returns a shallow copy of a portion of an array into a new array object selected from start to end (end not included) where start and end represent the index of items in that array.
        b = a.slice(-3);
        document.write('slice(): ' + b + '<br>');

        // The splice() method of Array instances changes the contents of an array by removing or replacing existing elements and/or adding new elements in place.
        // var pertama untuk menentuka pilihan index array, var kedua jika diisi 0 maka akan menambahkan value dan jika diisi lebih dari 1 akan berfungsi replace.
        a.splice(2, 0, "Putra");
        document.write('splice(): ' + a + '<br>');
    </script>
</body>
</html>
