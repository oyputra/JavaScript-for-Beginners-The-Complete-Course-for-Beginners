<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        // Modify and Delete Arrays
        var a = ["Joe", 7, "Ronaldo"];
        document.write(a + "<br/>");
        
        a[1] = "Cristiano";
        document.write(a + "<br/>");
        
        delete a[0];
        document.write(a + "<br/>");
        
        document.write(a[0] + "<br/>");
    </script>
</body>
</html>
