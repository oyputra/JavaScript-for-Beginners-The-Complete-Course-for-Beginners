<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // Break and Continue Statement
        for (var a = 1; a <= 12; a++) {
            if (a == 8) {
                document.write("Hey : " + a + "<br/>");
                continue;
            } else if (a == 10) {
                document.write("Hello : " + a + "<br/>");
                break;
            }
            document.write("NO : " + a + "<br/>");
        }
    </script>
</body>
</html>
