<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // If Else If Statement
        var value = 400;
        document.write('<h1>');
        if (value >= 0 && value < 60) {
            document.write("Seconds Ratio");
        } else if (value >= 60 && value < 120) {
            document.write("1 Hour Ratio");
        } else if (value >= 120 && value < 180) {
            document.write("2 Hour Ratio");
        } else if (value >= 180 && value < 240) {
            document.write("3 Hour Ratio");
        } else if (value >= 240) {
            document.write("Large Ratio");
        } else {
            document.write("Enter Correct Number!");
        }
        document.write('<h1/>');
    </script>
</body>
</html>
