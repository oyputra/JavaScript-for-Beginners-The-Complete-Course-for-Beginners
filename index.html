<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        // filter method
        var a = [10, 12, 8, 30, 38, 20];

        document.write(a + '<br>');
        
        var b = a.filter(checkvalue); 
        
        document.write(b + '<br>');
        
        function checkvalue(age) {
            return age >= 15;
        };
    </script>
</body>
</html>
