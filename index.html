<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // Global Variabel
        var x = 20;

        function fun(params) {
            // Lokal Variable
            var x = 15;
            document.write(x, '<br/>');
        }

        fun();
        document.write(x);
    </script>
</body>
</html>
