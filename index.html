<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
            // Arrays Objects
            var x = [
                {name: 'oyputra', age: 25},
                {name: 'zevan', age: 7},
                {name: 'shinta', age: 33},
            ];

            console.log(x);

            for(var i=0; i <= x.length; i++) {
                if (x[i]['name'] !== undefined) {
                    document.write(x[i].name + ' - ' + x[i].age + '<br>');
                }
            }
    </script>
</body>
</html>
