<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .outside {
        padding: 100px;
        background-color: yellow;
    }
    .inside {
        padding: 100px;
        background-color: aqua;
    }
    .newclass {
        background-color: red;
    }
</style>
<body>
    <div class="outside">
        <p>outside</p>
    </div>
    <div class="inside">
        <p>inside</p>
    </div>
    <script>
            // classList Method
            document.querySelector(".inside").addEventListener("click", fun);
            function fun(params) {
                document.querySelector(".inside").classList.add("newclass");
            }

            document.querySelector(".outside").addEventListener("click", funday);
            function funday(params) {
                document.querySelector(".outside").classList.remove("outside");
            }

            // juga bisa menggunakan classList.toggle atau contains
    </script>
</body>
</html>
