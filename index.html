<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
            // Date Method
            date = new Date();
            document.write('new Date(): ', date, '<br>');
            document.write('getDate(): ', date.getDate(), '<br>');
            document.write('getFullYear(): ', date.getFullYear(), '<br>');
            document.write('getHours(): ', date.getHours(), '<br>');
            document.write('getMonth(): ', date.getMonth(), '<br>');
            document.write('getSeconds(): ', date.getSeconds(), '<br>');

            date.setSeconds(10);
            date.setMinutes(10);
            date.setHours(10);
            date.setDate(2);
            date.setMonth(9);
            date.setFullYear(1998);
            document.write('date set: ', date);
    </script>
</body>
</html>
