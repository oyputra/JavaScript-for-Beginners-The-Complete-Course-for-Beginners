<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        // some & every method
        var a = [10, 10, 8, 2, 7, 3];
        var b = [15, 20, 25, 17, 23, 19];

        document.write(a + '<br>');
        document.write(b + '<br>');
        
        var c = a.some(checkvalue); 
        var d = b.some(checkvalue);
        
        document.write(c + '<br>');
        document.write(d + '<br>');
        
        function checkvalue(age) {
            return age >= 15;
        };
    </script>
</body>
</html>
