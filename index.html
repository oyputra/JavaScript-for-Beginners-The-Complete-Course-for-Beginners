<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        // Do While Loop
        var a = 1;
        do {
            document.write(a + ") Hello Gais! <br>");
            a++;
        } while (a <= 20);
    </script>
</body>
</html>
