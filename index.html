<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
            // For in Loop
            var a = {
                firstName: "oy",
                lastName: "putra",
                age: "25",
                city: "bekasi",
                education: "Bachelor's of Computer Science"
            };

            for (var key in a) {
                document.write(key + ": " + a[key] + "<br>");
            };
    </script>
</body>
</html>
