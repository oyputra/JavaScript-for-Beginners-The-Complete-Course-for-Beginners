<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
            // Math Method Part 1
            var x = 3.56;
            document.write("Value: ", x, "<br>Math.ceil(): ", Math.ceil(x), "<br><br>");
            var x = 3.56;
            document.write("Value: ", x, "<br>Math.floor(): ", Math.floor(x), "<br><br>");
            var x = 3.56;
            document.write("Value: ", x, "<br>Math.round(): ", Math.round(x), "<br><br>");
            var x = 3.56;
            document.write("Value: ", x, "<br>Math.trunc(): ", Math.trunc(x), "<br><br>");
            var x = [30, 20, 10, 40, 50, 60, 70];
            document.write("Value: ", x, "<br>Math.min(): ", Math.min(...x), "<br><br>");
            var x = [30, 20, 10, 40, 50, 60, 70];
            document.write("Value: ", x, "<br>Math.max(): ", Math.max(...x), "<br><br>");
    </script>
</body>
</html>
