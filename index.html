<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // Comparison Operator
        a = 10;
        b = 20;
        document.write('<h1>Comparison Operator</h1>');
        document.write('<h3>Variabel <br/>a = 10<br/>b = 20</h3>');
        
        // Equal To
        c = a == b
        document.write('1) Equal To "==" <br>a == b <br/>Jawaban: ' + c)   ;
        
        // Equal To and Data Type
        d = b === a;
        document.write('<br/><br/>2) Equal to and Data Type "==="<br/> b === a<br/>Jawaban: ' + d);
        
        // Not Equal To
        e = b != a;
        document.write('<br/><br/>3) Not Equal To "!=" <br/>b != a<br/>Jawaban: ' + e);
        
        // Not Equal To and Data Type
        f = a !== b;
        document.write('<br/><br/>4) Not Equal To and Data Type "!==" <br/>a !== b<br/>Jawaban: ' + f);
        
        // Greater Than
        g = b > a;
        document.write('<br/><br/>5) Greater Than ">" <br/>b > a<br/>Jawaban: ' + g);
        
        // Less Than
        h = b < a;
        document.write('<br/><br/>6) Less Than "<" <br/>b < a<br/>Jawaban: ' + h);
        
        // Greater Than and Equal To
        i = a >= b;
        document.write('<br/><br/>7) Greater Than and Equal To ">=" <br/>a >= b<br/>Jawaban: ' + i);
        
        // Less Than and Equal To
        j = a <= b;
        document.write('<br/><br/>8) Less Than and Equal "<=" <br/>a <= b<br/>Jawaban: ' + j);

    </script>
</body>
</html>
