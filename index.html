<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // Arithmetic Operators
        var a = 25;
        var b = 50;
        document.write('<h1>Arithmetic Operator</h1>');
        document.write('<h3>Variabel <br/>a = 25<br/>b = 50</h3>');
        
        // Addition
        c = a + b;
        document.write('1) Addition "+"<br/>c = a + b<br/>Jawaban: ' + c);
        
        // Subtraction
        d = b - a;
        document.write('<br/><br/>2) Subtraction "-"<br/>d = b - a<br/>Jawaban: ' + d);
        
        // Multipication
        e = a * b;
        document.write('<br/><br/>3) Multipication "*"<br/>e = a * b<br/>Jawaban: ' + e);
        
        // Exponentiation
        f = a ** b;
        document.write('<br/><br/>4) Exponentiation "**"<br/>f = a ** b<br/>Jawaban: ' + f);
        
        // Division
        g = b / a;
        document.write('<br/><br/>5) Division "/"<br/>g = b / a<br/>Jawaban: ' + g);
        
        // Modulus (Reminder)
        h = b % a;
        document.write('<br/><br/>6) Modulus (Reminder) "%"<br/>h = b % a<br/>Jawaban: ' + h);
        
        // Increment
        a++;
        document.write('<br/><br/>7) Increment "++"<br/>a++<br/>Jawaban: ' + a);
        
        // Decreament
        b--;
        document.write('<br/><br/>8) Decrement "--"<br/>b--<br/>Jawaban: ' + b);


    </script>
</body>
</html>
