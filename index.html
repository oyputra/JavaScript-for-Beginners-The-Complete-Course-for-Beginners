<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
            // Number Method
            a = "200.334";
            document.write('value: ', a, '<br>');
            document.write('type of: ', typeof a, '<br><br>');

            b = Number(a);
            document.write('Number(): ', b, ' ', typeof b, '<br>');

            b = parseInt(a);
            document.write('parseInt(): ', b, ' ', typeof b, '<br>');

            b = parseFloat(a);
            document.write('parseFloat(): ', b, ' ', typeof b, '<br>');

            b = isFinite(a);
            document.write('isFinite(): ', b, ' ', typeof b, '<br>');

            a = 200.334;
            document.write('<br>value: ', a, '<br>');
            document.write('type of: ', typeof a, '<br><br>');
            
            b = Number.isInteger(a);
            document.write('Number.isInteger(): ', b, ' ', typeof b, '<br>');
            
            b = a.toFixed(3);
            document.write('a.toFixed(3): ', b, ' ', typeof b, '<br>');

            b = a.toPrecision(10);
            document.write('a.toPrecision(10): ', b, ' ', typeof b, '<br>');
    </script>
</body>
</html>
