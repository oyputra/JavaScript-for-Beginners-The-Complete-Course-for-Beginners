<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        // Sort and Reverse Methods
        var a = ['Dominic', 'Carl', 'Ferrary', 'Elle', 'Axel', 'Barry'];
        document.write('Array: ', a, '<br>');
        a.sort();
        document.write('sort(): ', a, '<br>');
        a.reverse();
        document.write('reverse(): ', a, '<br>');
    </script>
</body>
</html>
