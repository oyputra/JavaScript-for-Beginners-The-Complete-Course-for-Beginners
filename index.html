<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // Functions with Parameters
        function abc(your_name, your_age) {
            document.write('Your Name is: ' + your_name + '<br/>Your Age is: ' + your_age)
        }

        your_name = prompt('Enter Your Name:');
        your_age = prompt('Enter Your Age:');
        
        if (your_name && your_age) {
            abc(your_name, your_age);
        } else {
            document.write('Thanks for your decision. Its Okay!');
        }
    </script>
</body>
</html>
