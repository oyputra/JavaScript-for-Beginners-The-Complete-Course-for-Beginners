<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        // The toString, valueOf, & fill Methods
        var a = [20, 30, 40];
        document.write(a + '<br/>');
        
        b = a.toString();
        document.write(b + '<br/>');

        c = a.fill('Hi');
        document.write(c + '<br/>');
    </script>
</body>
</html>
