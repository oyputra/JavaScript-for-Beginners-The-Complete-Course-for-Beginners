<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
            // Math Method Part 2
            var x = 64;
            document.write("Value: ", x, "<br>Math.sqrt(): ", Math.sqrt(x), "<br><br>");
            var x = 64;
            document.write("Value: ", x, "<br>Math.cbrt(): ", Math.cbrt(x), "<br><br>");
            var x = 8;
            var y = 2;
            document.write("Value: ", x, ', ', y, "<br>Math.pow(): ", Math.pow(x, y), "<br><br>");
            document.write("Math.random(): ", Math.random(), "<br><br>");
            document.write("Value: ", x, "<br>Math.floor(Math.random() * 10) + 1: ", Math.floor(Math.random() * 10) + 1, "<br><br>");
            var x = -64;
            document.write("Value: ", x, "<br>Math.abs(): ", Math.abs(x), "<br><br>");
            document.write("Math.PI: ", Math.PI, "<br><br>");
    </script>
</body>
</html>
