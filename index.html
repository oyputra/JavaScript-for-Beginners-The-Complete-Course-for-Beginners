<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // Condition Ternary Statement
        var x = 200;
        var y;

        // Way 1
        x >= 201 ? (y = 0) : (y = 100);
        document.write(y);

        // Way 2
        y = "Value: " + (x == 200 ? "Yes" : "No");
        document.write('<br/>', y);
    </script>
</body>
</html>
