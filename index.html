<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
            // String Methods Part 1
            var a = "Hello World!";
            document.write('Hello World!<br>');
            document.write('length: ' + a.length + '<br>');
            document.write('toLowerCase: ' + a.toLowerCase() + '<br>');
            document.write('toUpperCase: ' + a.toUpperCase() + '<br>');
            document.write('includes "Hello": ' + a.includes('Hello') + '<br>');
            document.write('startsWith "He": ' + a.startsWith('He') + '<br>');
            document.write('endsWith "d!": ' + a.endsWith('d!') + '<br>');
            document.write('search "Wo": ' + a.search('Wo') + '<br>');
    </script>
</body>
</html>
