<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<body>
    <script>
        // Includes Method
        var a = [10, 20, "30", 40, 50];
        document.write(a + '<br>');

        var b = a.includes("30");
        document.write(b + '<br>');
    </script>
