<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    #outer {
        width: 550px;
        height: 300px;
        padding: 10px 10px;
        margin: 0 auto;
        background: rgb(71, 49, 40);
    }
    #inner {
        width: 500px;
        height: 200px;
        padding: 10px 10px;
        margin: 0 auto;
        background: rgb(104, 23, 124);
    }
    #inner div {
        display: inline-block;
        background: rgb(241, 16, 16);
        width: 95px;
        height: 50px;
        line-height: 50px;
        text-align: center;
    }
</style>
<body>
    <div id="outer">
        <h2>Outer</h2>
        <div id="inner">
            <h2 id="innerside">Innerside</h2>
            <div>one</div>
            <div>two</div>
            <div id="child-c">three</div>
            <div>four</div>
            <div>five</div>
        </div>
        <h2>Last</h2>
    </div>
    <script>
            // Create Element Text Node
            var one = document.createElement("h3");
            var two = document.createTextNode("Learning JavaScripts");
            var three = document.createComment("This is a JS Comments");
            
            console.log(one);
            console.log(two);
            console.log(three);
    </script>
</body>
</html>
