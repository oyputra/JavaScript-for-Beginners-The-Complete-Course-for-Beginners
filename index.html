<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        // Pop and Push Methods
        var a = ['Dominic', 'Carl', 'Ferrary', 'Elle', 'Axel', 'Barry'];
        document.write('Array: ', a, '<br>');
        
        // The pop() method of Array instances removes the last element from an array and returns that element.
        a.pop();
        document.write('pop(): ', a, '<br>');

        // The push() method of Array instances adds the specified elements to the end of an array and returns the new length of the array.
        a.push('Putra');
        document.write('push(): ', a, '<br>');
    </script>
</body>
</html>
