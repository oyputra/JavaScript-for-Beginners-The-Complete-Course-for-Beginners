<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // Assignment Operator
        a = 10;
        b = 20;
        document.write('<h1>Assignment Operator</h1>');
        document.write('<h3>Variabel <br/>a = 10<br/>b = 20</h3>');
        
        // Addition
        a += b;
        document.write('1) a += b<br/>Jawaban: ' + a);
        
        // Subtraction
        a = 10;
        b = 20;
        b -= a;
        document.write('<br/><br/>2) b -= a<br/>Jawaban: ' + b);
        
        // Multipication
        a = 10;
        b = 20;
        b *= a;
        document.write('<br/><br/>3) b *= a<br/>Jawaban: ' + b);
        
        // Exponentiation
        a = 10;
        b = 20;
        a **= b;
        document.write('<br/><br/>4) a **= b<br/>Jawaban: ' + a);
        
        // Division
        a = 10;
        b = 20;
        b /= a;
        document.write('<br/><br/>5) b /= a<br/>Jawaban: ' + b);
        
        // Modulus (Reminder)
        a = 10;
        b = 20;
        b %= a;
        document.write('<br/><br/>6) b %= a<br/>Jawaban: ' + b);
        
        // Equal
        a = 10;
        b = 20;
        a = b;
        document.write('<br/><br/>7) a = b<br/>Jawaban: ' + a);


    </script>
</body>
</html>
