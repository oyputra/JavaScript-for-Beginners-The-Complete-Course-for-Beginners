<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // Function with Return
        function add(Math, Che, Phy) {
            var y = Math + Che + Phy;
            return y;
        }
        function percentage(total) {
            var z = (total / 300) * 100;
            document.write(z);
        }

        var sum = add(90, 100, 70);
        percentage(sum);
    </script>
</body>
</html>
