<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        // find & findIndex method
        var a = [10, 12, 8, 30, 7, 3];

        document.write(a + '<br>');
        
        var b = a.find(checkvalue); 
        var c = a.findIndex(checkvalue);
        
        document.write(b + '<br>');
        document.write(c + '<br>');
        
        function checkvalue(age) {
            return age >= 15;
        };
    </script>
</body>
</html>
