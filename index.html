<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        // The forEach Method
        var Name = ["Jokowi", "Prabowo", "Ganjar", "Anies"];
        document.write(Name + " :<br/>");
        Name.forEach(loop);
        function loop(value, index) {
            document.write(index + ") " + value + "<br/>");
        }
    </script>
</body>
</html>
